name: Build and Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adv-build-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[dev,service]" && python -m pip install bandit==1.8.3 pip-audit==2.10.1
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Static quality gate
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Security gate
        run: |
          bandit -r src/ -ll
          pip-audit --local
      - name: Build/release smoke check
        run: python -m build
