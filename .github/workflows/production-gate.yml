name: Build and Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adv-build-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip build && python -m pip install -e ".[dev,service]" && python -m pip install bandit==1.8.3 pip-audit==2.10.1
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Static quality gate
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: Security gate
        run: |
          bandit -r src/ -ll
          pip-audit --local
      - name: Build/release smoke check
        run: python -m build
