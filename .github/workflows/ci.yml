name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.8.4"
  PYRIGHT_VERSION: "1.1.388"
  BANDIT_VERSION: "1.8.3"
  PIP_AUDIT_VERSION: "2.10.1"
  CYCLONEDX_VERSION: "5.1.1"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint and package dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==${{ env.RUFF_VERSION }} pyright==${{ env.PYRIGHT_VERSION }}
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check src/adv_lab tests --output-format=github

      - name: Run Ruff Formatter Check
        run: ruff format --check src/adv_lab tests

      - name: Focused Pyright gate
        run: pyright src/adv_lab/eval/ci_signing.py

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout attack-v19-core (optional)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: poojakira/attack-v19-core
          path: attack-v19-core
          token: ${{ secrets.ATTACK_CORE_TOKEN }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -d "attack-v19-core" ]; then
            pip install -e ./attack-v19-core
            pip install -e ".[dev,attack]"
          else
            pip install -e ".[dev]"
          fi

      - name: Run tests with coverage
        run: |
          PYTHONPATH=src pytest tests/ -v --tb=short \
            --cov=adv_lab \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60 \
            -W error::DeprecationWarning \
            -W error::PendingDeprecationWarning

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30

      - name: Verify test collection
        run: |
          count=$(PYTHONPATH=src python -m pytest tests/ --collect-only -q 2>/dev/null | tail -1 | grep -oP '\d+(?= tests)')
          count=${count:-0}
          if [ "$count" -lt 5 ]; then
            echo "Expected at least 5 tests collected, got $count"
            exit 1
          fi
          echo "Collected $count tests"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install security tools
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install bandit==${{ env.BANDIT_VERSION }}
          pip install pip-audit==${{ env.PIP_AUDIT_VERSION }}
          pip install cyclonedx-bom==${{ env.CYCLONEDX_VERSION }}
          pip install -e ".[dev]"

      - name: Bandit SAST (fail on HIGH/MEDIUM)
        run: |
          bandit -r src/ -ll -f json -o bandit-report.json
          python .github/scripts/check_bandit.py

      - name: pip-audit (fail on known vulns)
        run: |
          pip-audit -r requirements.txt --skip-editable --format json -o pip-audit.json || true
          python .github/scripts/check_pip_audit.py

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --outfile sbom.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        language: ['python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"



