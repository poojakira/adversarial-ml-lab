name: CI — Tests, Coverage & Robustness

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        run: |
          pip install ruff mypy

      - name: Run ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Run mypy (type checking)
        run: mypy --ignore-missing-imports attacks/ defenses/ evaluation/ || true

  test:
    name: Tests & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]" || pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-cov pytest-xdist pytest-timeout

      - name: Install PyTorch (CPU)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run unit tests with coverage
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --timeout=300 \
            -x \
            -v

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Coverage comment on PR
        if: matrix.python-version == '3.11' && github.event_name == 'pull_request'
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.90

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]" || pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-timeout torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run integration tests
        run: |
          pytest tests/test_integration_attack_defense.py \
            --timeout=600 \
            -v \
            --tb=short

  robustness-benchmark:
    name: Robustness Regression Gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run robustness benchmark
        run: |
          python benchmarks/robustness_regression.py \
            --device cpu \
            --output benchmark-results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json

      - name: Check for regression
        run: |
          python -c "
          import json, sys
          results = json.load(open('benchmark-results.json'))
          if results['status'] != 'pass':
              print('❌ Robustness regression detected!')
              for f in results.get('failures', []):
                  print(f'  ✗ {f}')
              sys.exit(1)
          print('✅ Robustness gate passed')
          print(f'  Clean accuracy: {results[\"clean_accuracy\"]:.4f}')
          print(f'  Robust accuracy: {results[\"robust_accuracy\"]:.4f}')
          print(f'  Attack time: {results[\"attack_time_ms\"]:.2f}ms')
          "

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pip-audit safety bandit

      - name: Run pip-audit
        run: pip-audit || true

      - name: Run bandit (security linter)
        run: bandit -r attacks/ defenses/ evaluation/ -f json -o bandit-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, test, integration, robustness-benchmark, security]
    if: always()

    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.robustness-benchmark.result }}" != "success" ]; then
            echo "❌ One or more required checks failed"
            exit 1
          fi
          echo "✅ All checks passed"
