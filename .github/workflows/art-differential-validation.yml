name: IBM ART Differential Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install project and independent reference implementation
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "adversarial-robustness-toolbox>=1.20,<2"
      - name: Run differential validation
        run: python validation/art_differential.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: art-differential-validation
          path: results/art_differential_validation.json
