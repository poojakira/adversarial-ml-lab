name: One-time Ruff Format

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ruff-format-once.yml"
      - ".github/format-trigger.txt"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply Ruff formatter
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.8
          ruff format .
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Ruff formatter"
          git push origin HEAD:main

# trigger: production formatting maintenance
