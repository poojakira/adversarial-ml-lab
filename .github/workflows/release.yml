name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  verify-build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verification tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine pyright bandit==1.8.3 pip-audit==2.10.1

      - name: Verify release tag matches package version
        run: |
          python - <<'PY'
          import os, tomllib
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          print(f"release version verified: {version}")
          PY

      - name: Run release gates
        run: |
          ruff check src/adv_lab tests
          ruff format --check src/adv_lab tests
          pyright src/adv_lab/eval/ci_signing.py
          bandit -r src/adv_lab -ll
          pip-audit --skip-editable --progress-spinner=off
          PYTHONPATH=src pytest tests/ -q --cov=adv_lab --cov-fail-under=15

      - name: Verify production mode refuses implicit evidence
        run: |
          if python -m adv_lab.eval.benchmark_runner --production; then
            echo "production benchmark unexpectedly accepted missing model/dataset"
            exit 1
          fi

      - name: Build distribution
        run: python -m build

      - name: Verify distribution metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/
          retention-days: 5

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: verify-build
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install built wheel and generate CycloneDX SBOM
        run: |
          python -m pip install --upgrade pip
          pip install dist/*.whl
          pip install cyclonedx-bom==5.1.1
          cyclonedx-py environment --output-format JSON --outfile sbom.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 5

  publish-image:
    name: Publish batch evaluator image
    runs-on: ubuntu-latest
    needs: verify-build
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable evaluation job image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  sign-release:
    name: Sign release artifacts
    runs-on: ubuntu-latest
    needs: [verify-build, sbom, publish-image]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Install Sigstore
        run: pip install sigstore

      - name: Sign and verify packages and SBOM
        run: |
          for file in dist/* sbom/sbom.cdx.json; do
            python -m sigstore sign "$file"
            python -m sigstore verify identity               --cert-oidc-issuer https://token.actions.githubusercontent.com               --cert-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"               "$file"
          done

      - name: Attest distribution provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            sbom/*
          body: |
            Release artifacts passed repository lint, tests, static security
            analysis, and dependency audit before publication.

            The OCI image is a **batch robustness-admission job**, not an HTTP
            service. It starts in `--production` mode and therefore requires an
            explicit TorchScript model plus an NPZ evaluation set.

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: sign-release
    environment:
      name: pypi
      url: https://pypi.org/p/adversarial-ml-lab
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
